name: Pipeline [test -> build -> deploy]

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      additional_docker_tag:
        description: Additional docker tag that can be used to specify stable or testing tags
        required: false
        default: ''
        type: string
      push:
        description: Push docker image to registry flag
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  # Only cancel in progress when on a branch - use SHA on main to ensure uniqueness.
  # This will allow multiple pipelines to run at the same time on main.
  # Note that two pipelines running within a few minutes of each other will cause issues with helm deploying to
  # a namespace, as the second one will not be able to get a lock as a deploy will be in progress.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  check_publish:
    name: Check publish flag
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ github.ref == 'refs/heads/main' && (inputs.push || inputs.push == null) }}
    steps:
      - name: Set publish flag
        run: echo "Publishing enabled ${{ github.ref == 'refs/heads/main' && (inputs.push || inputs.push == null) }}"


  helm_lint:
    strategy:
      matrix:
        environments: ['dev', 'preprod', 'prod']
    name: helm lint
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/test_helm_lint.yml@v2 # WORKFLOW_VERSION
    secrets: inherit
    with:
      environment: ${{ matrix.environments }}


  app_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.app_version.outputs.version }}
    steps:
      - id: app_version
        name: Application version creators
        uses: ministryofjustice/hmpps-github-shared-actions/.github/actions/build-test-and-deploy/create_app_version@f52dbae537425d92f2216c4a2d9e0e44e603abb1 #v1

  gradle_verify:
    name: Validate the kotlin
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/gradle_verify.yml@v2
    secrets: inherit
    with:
      gradle-command: 'BUILD_NUMBER=${{ needs.app_version.outputs.version}} ./gradlew assemble check'
      upload-build-artifacts: ${{ github.ref == 'refs/heads/main' }}
      upload-test-artifacts: true
      java-version: "25"
    needs:
      - app_version

  coverage:
    name: Code Coverage Report
    runs-on: ubuntu-latest
    needs: gradle_verify
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: build

      - name: Publish Coverage Report
        uses: madrapps/jacoco-report@7c362aca34caf958e7b1c03464bd8781db9f8da7 #1.7.1
        with:
          paths: |
            build/reports/jacoco/integration/jacoco.xml
            build/reports/jacoco/unit/jacoco.xml

          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 0
          title: 'Code Coverage Report'
          pass-emoji: ':white_check_mark:'
          fail-emoji: ':x:'
          update-comment: true

  build:
    name: Build docker image from hmpps-github-actions
    if: github.ref == 'refs/heads/main'
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/docker_build.yml@v2
    needs:
      - gradle_verify
      - check_publish
    with:
      docker_registry: 'ghcr.io'
      registry_org: 'ministryofjustice'
      additional_docker_tag: ${{ inputs.additional_docker_tag }}
      push: ${{ needs.check_publish.outputs.enabled == 'true' }}
      docker_multiplatform: false
      download_build_artifacts: true
      generate_sbom: ${{ needs.check_publish.outputs.enabled == 'true' }}
      attach_sbom_to_registry: ${{ needs.check_publish.outputs.enabled == 'true' }}
      sign_image: ${{ needs.check_publish.outputs.enabled == 'true' }}

  deploy_dashboard:
    name: Deploy To Dev
    runs-on: ubuntu-latest
    if: needs.check_publish.outputs.enabled == 'true'
    needs:
      - check_publish
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZ_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_TENANT_ID }}
          subscription-id: ${{ secrets.AZ_SUBSCRIPION_ID }}
          client-secret: ${{ secrets.AZ_CLIENT_SECRET }}

      - name: Deploy_dashboard
        uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3
        with:
          inlineScript: |
            
            # 1. Replace placeholders in the JSON file
            sed -i "s/__AZ_SUBSCRIPTION_ID__/${{ secrets.AZ_SUBSCRIPION_ID }}/g" ./deploy/dashboards/dashboard-dev.json
            sed -i "s/__DASHBOARD_RESOURCE_GROUP__/${{ vars.DASHBOARD_RESOURCE_GROUP }}/g" ./deploy/dashboards/dashboard-dev.json
            sed -i "s/__DASHBOARD_RESOURCE_NAME__/${{ vars.DASHBOARD_RESOURCE_NAME }}/g" ./deploy/dashboards/dashboard-dev.json
            
            az deployment group create \
            --subscription "${{ secrets.AZ_SUBSCRIPION_ID }}" \
            --resource-group "dashboards" \
            --template-file "./deploy/dashboards/prisoner-finance-template-arm.json" \
            --parameters serializedData="$(jq -c . ./deploy/dashboards/dashboard-dev.json)"

  deploy_dev:
    name: Deploy to the development environment
    needs:
      - build
      - helm_lint
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/deploy_env.yml@v2
    secrets: inherit
    with:
      environment: 'dev'
      app_version: '${{ needs.build.outputs.app_version }}'
      slack_notification: 'true'
  dev_smoke_tests:
    name: Dev smoke test
    uses: ./.github/workflows/smoke-test-dev.yml
    secrets: inherit
    needs:
      - deploy_dev
  deploy_preprod:
     name: Deploy to pre-production environment
     needs:
       - build
       - deploy_dev
       - dev_smoke_tests
     uses: ministryofjustice/hmpps-github-actions/.github/workflows/deploy_env.yml@v2 # WORKFLOW_VERSION
     secrets: inherit
     with:
       environment: 'preprod'
       app_version: '${{ needs.build.outputs.app_version }}'
       slack_notification: 'true' # if 'true', it needs a valid NONPROD_RELEASES_SLACK_CHANNEL variable to be set
  deploy_prod:
     name: Deploy to production environment
     needs:
       - build
       - deploy_preprod
     uses: ministryofjustice/hmpps-github-actions/.github/workflows/deploy_env.yml@v2 # WORKFLOW_VERSION
     secrets: inherit
     with:
       environment: 'prod'
       app_version: '${{ needs.build.outputs.app_version }}'
       slack_notification: 'true' # if 'true', it needs a valid PROD_RELEASES_SLACK_CHANNEL variable to be set
