---
# Per environment values which override defaults in hmpps-prisoner-finance-api/values.yaml

generic-service:
  replicaCount: 2

  ingress:
    host: prisoner-finance-api-dev.hmpps.service.justice.gov.uk

  env:
    APPLICATIONINSIGHTS_CONFIGURATION_FILE: "applicationinsights.dev.json"
    HMPPS_AUTH_URL: "https://sign-in-dev.hmpps.service.justice.gov.uk/auth"
    GENERAL_LEDGER_API_URL: "https://prisoner-finance-general-ledger-api-dev.hmpps.service.justice.gov.uk"
    SPRINGDOC_API-DOCS_ENABLED: "true"
    SPRINGDOC_SWAGGER-UI_ENABLED: "true"
    ENV_STRING: "dev"